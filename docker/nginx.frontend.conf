# nginx config for the static frontend image (Dockerfile.frontend).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security + caching basics
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

    # Long cache for fingerprintable static assets
    location ~* \.(?:css|js|png|jpg|jpeg|gif|ico|svg|woff2?|webmanifest)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # Don't cache the service worker or manifest aggressively
    location = /service-worker.js {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page 404 /404.html;
}
