name: 🐛 Bug report
description: Report a problem with the game, the API, or the mazeforge library.
title: '[Bug]: '
labels: ['bug', 'triage']
assignees: ['hoangsonww']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug! Please fill in as much as you can.
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of the project is affected?
      options:
        - Frontend (game UI)
        - Backend API
        - Accounts / auth
        - mazeforge (Python library)
        - Docker / CI
        - Docs
        - Other
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug and what you expected instead.
      placeholder: When I ... I expected ... but instead ...
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See error
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      description: Browser / OS / Node or Python version, deployment (Render, local, Docker)…
      placeholder: 'Chrome 126 · macOS 14 · local'
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs / console output
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-flight
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
